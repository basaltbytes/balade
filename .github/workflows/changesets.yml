name: changesets
# Maintains the rolling "Version Packages" PR from pending changesets and,
# once that PR merges, tags the new version and hands the tag to release.yml.
# Publish stays in release.yml: npmjs.com pins that exact workflow file as the
# package's trusted publisher (OIDC), so this workflow never touches npm.
# The `gh workflow run` dispatch is required — tags pushed with the default
# GITHUB_TOKEN never fire another workflow's `push: tags` trigger, and the
# repository deliberately holds no long-lived tokens that would.
on:
  push:
    branches: [main]
  # manual fallback: re-runs the version-or-tag decision at main's HEAD
  workflow_dispatch:
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
concurrency:
  group: changesets
  cancel-in-progress: false
permissions:
  contents: write # push the version branch and the release tag
  pull-requests: write # open and update the "Version Packages" PR
  actions: write # dispatch release.yml on the new tag
jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Full history: changelog entries name the commit that added each
        # changeset, which a shallow clone cannot see.
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with: { version: 10 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Maintain the Version Packages PR
        id: changesets
        uses: changesets/action@22ccf9aa43179fe9e27dc62e575971d28cce197c # v2.0.0
        with:
          # package.json is the CLI's version source; the installed binary
          # reads it directly at startup.
          version: pnpm changeset:version
          # No `publish` input on purpose: publishing belongs to release.yml.
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # No pending changesets and an untagged package.json version means the
      # Version Packages PR just merged: tag it and dispatch the publisher.
      - name: Tag and hand off to release.yml
        if: steps.changesets.outputs.hasChangesets == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "$TAG already exists; nothing to release."
            exit 0
          fi
          git tag "$TAG"
          git push origin "$TAG"
          gh workflow run release.yml --ref "$TAG"
