name: ci
on:
  push: { branches: [main] }
  pull_request:
# PR code (install scripts, build, tests) runs with this token in the
# environment; keep it read-only regardless of the repository default.
permissions:
  contents: read
env:
  # Node 24 becomes the forced default for actions on 2026-06-16; opt in early.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  checks:
    strategy:
      matrix: { os: [ubuntu-latest, macos-latest, windows-latest], node: [22, 24] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with: { version: 10 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "${{ matrix.node }}", cache: pnpm }
      # Every OS installs ripgrep from its package manager: Pi's fallback
      # downloads it through an anonymous GitHub API call, which shared runner
      # IPs rate-limit unpredictably (#82).
      - name: Install ripgrep on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Install ripgrep on macOS
        if: runner.os == 'macOS'
        run: brew install ripgrep
      - name: Install ripgrep on Windows
        if: runner.os == 'Windows'
        run: choco install ripgrep --yes --no-progress
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm build
      # PI_OFFLINE forbids the download fallback, so a missing binary fails
      # deterministically instead of by network luck.
      - run: pnpm test
        env: { PI_OFFLINE: "1" }
  npm-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with: { version: 10 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm package:smoke
