name: release
# Publishes to npm via OIDC trusted publishing — no NPM_TOKEN secret anywhere.
# npmjs.com must list this exact workflow (basaltbytes/balade, release.yml) as
# the package's trusted publisher; the registry then accepts the runner's OIDC
# identity. Because this repository and package are public, npm also generates
# provenance attestations for tag publishes.
on:
  push:
    tags: ["v*"]
  # manual fallback: publishes whatever version the chosen ref carries
  workflow_dispatch:
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
concurrency:
  group: release
  cancel-in-progress: false
permissions:
  id-token: write # OIDC exchange with the npm registry
  contents: write # GitHub Release creation
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with: { version: 10 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Tag must match package.json
        if: github.ref_type == 'tag'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG does not match package.json version $PKG"
            exit 1
          fi
      # prepublishOnly runs the full gate (lint, format:check, typecheck,
      # build, test, packed npm install smoke);
      # --no-git-checks because a tag checkout is a detached HEAD.
      # NPM_CONFIG_PROVENANCE keeps provenance explicit for pnpm and matches
      # package.json publishConfig.provenance.
      - run: pnpm publish --access public --no-git-checks
        env:
          NPM_CONFIG_PROVENANCE: "true"
      - name: GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
