name: release
# Publishes to npm via OIDC trusted publishing — no NPM_TOKEN secret anywhere.
# npmjs.com must list this exact workflow (basaltbytes/balade, release.yml) as
# the trusted publisher of balade, @balade/core and @balade/viewer; the
# registry then accepts the runner's OIDC identity. Because this repository and
# the packages are public, npm also generates provenance attestations for tag
# publishes.
on:
  push:
    tags: ["v*"]
  # manual fallback: publishes whatever version the chosen ref carries
  workflow_dispatch:
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
concurrency:
  group: release
  cancel-in-progress: false
permissions:
  id-token: write # OIDC exchange with the npm registry
  contents: write # GitHub Release creation
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with: { version: 10 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Tag must match package.json
        if: github.ref_type == 'tag'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG does not match package.json version $PKG"
            exit 1
          fi
      # The packed viewer smoke in the gate drives Chromium.
      - run: pnpm exec playwright install --with-deps chromium
      # The full gate (lint, format:check, typecheck, build, test, packed npm
      # install smoke of all three packages) runs once; the publishes below
      # skip prepublishOnly with --ignore-scripts.
      - run: pnpm run release:check
      # @balade/core and @balade/viewer publish before balade, which depends on
      # core. `-r publish` skips a version npm already has, so a package the
      # owner published by hand (a new package's first version) is not retried.
      # --no-git-checks because a tag checkout is a detached HEAD.
      # NPM_CONFIG_PROVENANCE keeps provenance explicit for pnpm and matches
      # each package.json publishConfig.provenance.
      - run: pnpm -r publish --access public --no-git-checks --ignore-scripts
        env:
          NPM_CONFIG_PROVENANCE: "true"
      - run: pnpm publish --access public --no-git-checks --ignore-scripts
        env:
          NPM_CONFIG_PROVENANCE: "true"
      - name: GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
