name: release
# Versions and publishes through changesets and npm OIDC trusted publishing;
# there is no NPM_TOKEN secret. npmjs.com lists this workflow
# (basaltbytes/balade, release.yml) as the trusted publisher of balade,
# @balade/core and @balade/viewer. A package's first version is published by
# hand from a logged-in machine, because npm only accepts a trusted publisher on
# a package that already exists.
#
# On every push to main the changesets action maintains the rolling "Version
# Packages" PR. Once that PR merges, the publish script stages the new versions
# on npm; an npm maintainer approves them, and the next run of this job tags the
# release and creates its GitHub Release once every version is public.
on:
  push:
    branches: [main]
  # manual fallback: re-runs the version-or-publish decision at main's HEAD
  workflow_dispatch:
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write # push the version branch and the release tags
      pull-requests: write # open and update the "Version Packages" PR
      id-token: write # OIDC exchange with the npm registry
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Full history: changelog entries name the commit that added each
        # changeset, which a shallow clone cannot see.
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Create the Version Packages PR or stage the release
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm changeset:version
          publish-script: pnpm changeset:publish
          # The v<version> tag and the GitHub Release come from
          # scripts/release/tag.mjs once npm shows every version; the action
          # only recognises `changeset publish` output.
          create-github-releases: false
          push-git-tags: false
